    // --- HELPER DE COMPRESSION D'IMAGE EN CANVAS ---
    function compressImage(file, maxWidth = 900, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };
      });
    }

    // --- PHOTOS : stockées dans le dépôt GitHub (dossier photos/), jamais dans localStorage ---
    // Le JSON ne contient que des chemins ("photos/xxx.jpg"). Les images sont conservées
    // en cache dans IndexedDB (affichage hors ligne + file d'attente d'envoi).
    const PHOTO_FIELDS = ["resultPhoto", "originalPhoto"];
    const IMG_RE = /^(data:|https?:|blob:)/;
    const PLACEHOLDER = "https://placehold.co/600x400/f5f5f4/a8a29e?text=Pas+de+photo";
    let GH_CFG = {};

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("saveurs_photos", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("photos");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbGet(key) {
      try {
        const db = await openDB();
        return await new Promise((res) => {
          const q = db.transaction("photos").objectStore("photos").get(key);
          q.onsuccess = () => res(q.result);
          q.onerror = () => res(undefined);
        });
      } catch (e) { return undefined; }
    }
    async function idbPut(key, val) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").put(val, key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }
    async function idbKeys() {
      try {
        const db = await openDB();
        return await new Promise((res) => {
          const q = db.transaction("photos").objectStore("photos").getAllKeys();
          q.onsuccess = () => res(q.result);
          q.onerror = () => res([]);
        });
      } catch (e) { return []; }
    }
    const blobToDataUrl = (blob) => new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.readAsDataURL(blob);
    });

    // Remplace les photos en base64 par un chemin "photos/..." (l'image part dans IndexedDB, en attente d'envoi)
    async function externalizeRecipe(recipe) {
      const out = { ...recipe };
      for (const f of PHOTO_FIELDS) {
        if (typeof out[f] === "string" && out[f].startsWith("data:")) {
          const suffix = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          const path = `photos/${String(out.id || "recette").replace(/[^a-zA-Z0-9_-]/g, "")}-${f === "resultPhoto" ? "resultat" : "original"}-${suffix}.jpg`;
          await idbPut(path, { data: out[f], uploaded: false });
          out[f] = path;
        }
      }
      if (Array.isArray(out.stepPhotos)) {
        out.stepPhotos = await Promise.all(out.stepPhotos.map(async (photo, i) => {
          if (typeof photo === "string" && photo.startsWith("data:")) {
            const suffix = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const path = `photos/${String(out.id || "recette").replace(/[^a-zA-Z0-9_-]/g, "")}-etape${i + 1}-${suffix}.jpg`;
            await idbPut(path, { data: photo, uploaded: false });
            return path;
          }
          return photo;
        }));
      }
      return out;
    }

    // Envoie vers GitHub les photos référencées qui n'y sont pas encore
    async function uploadPendingPhotos(list, cfg, setMsg) {
      const refs = new Set();
      list.forEach((r) => {
        PHOTO_FIELDS.forEach((f) => r[f] && refs.add(r[f]));
        (r.stepPhotos || []).forEach((p) => p && refs.add(p));
      });
      const todo = [];
      for (const key of await idbKeys()) {
        if (!refs.has(key)) continue;
        const rec = await idbGet(key);
        if (rec && rec.data && !rec.uploaded) todo.push([key, rec]);
      }
      let i = 0;
      for (const [path, rec] of todo) {
        i++;
        setMsg(`Envoi des photos vers GitHub (${i}/${todo.length})...`);
        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${cfg.token}`,
            "Content-Type": "application/json",
            Accept: "application/vnd.github.v3+json"
          },
          body: JSON.stringify({
            message: `Ajout photo ${path}`,
            content: rec.data.split(",")[1],
            branch: cfg.branch || "main"
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Échec de l'envoi de ${path}`);
        }
        await idbPut(path, { ...rec, uploaded: true });
      }
    }

    // Retourne une URL affichable pour un chemin de photo : cache local → site publié → API GitHub
    async function resolvePhoto(src) {
      if (!src) return "";
      if (IMG_RE.test(src)) return src;
      const rec = await idbGet(src);
      if (rec && rec.data) return rec.data;
      try {
        const r = await fetch("./" + src);
        if (r.ok && (r.headers.get("content-type") || "").startsWith("image/")) {
          const data = await blobToDataUrl(await r.blob());
          await idbPut(src, { data, uploaded: true });
          return data;
        }
      } catch (e) {}
      const c = GH_CFG;
      if (c && c.token && c.owner && c.repo && navigator.onLine) {
        try {
          const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${src}?ref=${c.branch || "main"}`, {
            headers: { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github.raw" }
          });
          if (r.ok) {
            const data = await blobToDataUrl(await r.blob());
            await idbPut(src, { data, uploaded: true });
            return data;
          }
        } catch (e) {}
      }
      return "";
    }

    function PhotoImg({ src, fallback, alt, className }) {
      const [url, setUrl] = useState(src && IMG_RE.test(src) ? src : "");
      useEffect(() => {
        let alive = true;
        if (!src) { setUrl(""); return; }
        resolvePhoto(src).then((u) => { if (alive) setUrl(u); });
        return () => { alive = false; };
      }, [src, GH_CFG.token]);
      return <img src={url || fallback || PLACEHOLDER} alt={alt} className={className} />;
    }

    // --- EXEMPLES DE RECETTES PAR DÉFAUT ---
    const DEMO_RECIPES = [
      {
        id: "demo-1",
        title: "Poulet Rôti aux Herbes & Ail Doux",
        category: "Plats",
        prepTime: "20 min",
        cookTime: "50 min",
        servings: 4,
        rating: 5,
        originalSource: "Livre 'Recettes Familiales' p. 45",
        originalPhoto: "https://images.unsplash.com/photo-1598103442097-8b74394b95c6?auto=format&fit=crop&w=800&q=80",
        resultPhoto: "https://images.unsplash.com/photo-1598103442097-8b74394b95c6?auto=format&fit=crop&w=800&q=80",
        adaptations: "J'ai remplacé le beurre gras par du beurre clarifié et rajouté du thym frais du jardin avec des gousses d'ail rôties en chemise.",
        ingredients: [
          "1 poulet fermier de 1.5 kg",
          "6 gousses d'ail entières",
          "3 branches de thym frais",
          "2 c. à soupe d'huile d'olive",
          "Sel et poivre moulu"
        ],
        steps: [
          "Préchauffer le four à 200°C.",
          "Badigeonner le poulet d'huile d'olive et saler généreusement.",
          "Disposer l'ail et le thym dans le plat.",
          "Enfourner pour 50 minutes en arrosant à mi-cuisson."
        ],
        tags: ["Poulet", "Rôti", "Familial"],
        updatedAt: new Date().toISOString()
      }
    ];

    // --- COMPOSANT PRINCIPAL ---
    function App() {
      const [recipes, setRecipes] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Toutes");
      const [selectedRecipe, setSelectedRecipe] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [recipeToEdit, setRecipeToEdit] = useState(null);
      const [syncStatus, setSyncStatus] = useState("idle"); // 'idle', 'syncing', 'success', 'error'
      const [statusMessage, setStatusMessage] = useState("");
      const [lightboxSrc, setLightboxSrc] = useState(null);

      // --- PWA : installation, mode hors ligne, mise à jour ---
      const [installPrompt, setInstallPrompt] = useState(null);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [swRegistration, setSwRegistration] = useState(null); // défini quand une nouvelle version attend

      // Paramètres GitHub pré-configurés pour Sims07/cooking-note
      const [githubConfig, setGithubConfig] = useState({
        token: "",
        owner: "Sims07",
        repo: "cooking-note",
        path: "recettes.json",
        branch: "main"
      });

      GH_CFG = githubConfig;

      // Écouteurs PWA
      useEffect(() => {
        const onBeforeInstall = (e) => { e.preventDefault(); setInstallPrompt(e); };
        const onInstalled = () => { setInstallPrompt(null); setStatusMessage("Application installée !"); setSyncStatus("success"); setTimeout(() => { setSyncStatus("idle"); setStatusMessage(""); }, 3000); };
        const onOnline = () => setIsOnline(true);
        const onOffline = () => setIsOnline(false);
        const onSwUpdate = (e) => setSwRegistration(e.detail);

        window.addEventListener("beforeinstallprompt", onBeforeInstall);
        window.addEventListener("appinstalled", onInstalled);
        window.addEventListener("online", onOnline);
        window.addEventListener("offline", onOffline);
        window.addEventListener("sw-update-ready", onSwUpdate);
        if (window.__swUpdateReg) setSwRegistration(window.__swUpdateReg);

        return () => {
          window.removeEventListener("beforeinstallprompt", onBeforeInstall);
          window.removeEventListener("appinstalled", onInstalled);
          window.removeEventListener("online", onOnline);
          window.removeEventListener("offline", onOffline);
          window.removeEventListener("sw-update-ready", onSwUpdate);
        };
      }, []);

      // Raccourci d'application : ./?action=new ouvre directement le formulaire
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("action") === "new") {
          setRecipeToEdit(null);
          setIsFormOpen(true);
          window.history.replaceState({}, "", window.location.pathname);
        }
      }, []);

      const handleInstall = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        setInstallPrompt(null);
      };

      const applyUpdate = () => {
        if (swRegistration && swRegistration.waiting) {
          swRegistration.waiting.postMessage({ type: "SKIP_WAITING" });
        }
      };

      // Charger la configuration et les recettes au démarrage
      useEffect(() => {
        const savedConfig = localStorage.getItem("saveurs_github_config");
        if (savedConfig) {
          try {
            setGithubConfig(JSON.parse(savedConfig));
          } catch(e) {}
        }

        const savedRecipes = localStorage.getItem("saveurs_local_recipes");
        (async () => {
          try {
            const parsed = savedRecipes ? JSON.parse(savedRecipes) : DEMO_RECIPES;
            setRecipes(await Promise.all(parsed.map(externalizeRecipe)));
          } catch(e) {
            setRecipes(DEMO_RECIPES);
          }
        })();
      }, []);

      // Sauvegarde automatique en localStorage
      useEffect(() => {
        if (recipes.length > 0) {
          localStorage.setItem("saveurs_local_recipes", JSON.stringify(recipes));
        }
      }, [recipes]);

      // Synchronisation vers GitHub (Écriture)
      const saveToGitHub = async (customRecipesList = null) => {
        const listToSave = customRecipesList || recipes;
        if (!githubConfig.token || !githubConfig.owner || !githubConfig.repo) {
          setIsSettingsOpen(true);
          setStatusMessage("Veuillez d'abord configurer vos identifiants GitHub.");
          return;
        }

        if (!navigator.onLine) {
          setSyncStatus("error");
          setStatusMessage("Hors ligne : recette enregistrée sur cet appareil. Cliquez sur ↻ une fois reconnecté pour publier sur GitHub.");
          return;
        }

        setSyncStatus("syncing");
        setStatusMessage("Synchronisation avec GitHub en cours...");

        try {
          const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.path}`;
          
          await uploadPendingPhotos(listToSave, githubConfig, setStatusMessage);

          let sha = "";
          try {
            const getRes = await fetch(url, {
              headers: {
                Authorization: `Bearer ${githubConfig.token}`,
                Accept: "application/vnd.github.v3+json"
              }
            });
            if (getRes.ok) {
              const getData = await getRes.json();
              sha = getData.sha;
            }
          } catch (err) {
            console.log("Fichier non existant, création d'un nouveau fichier.");
          }

          const jsonString = JSON.stringify(listToSave, null, 2);
          const bytes = new TextEncoder().encode(jsonString);
          let binString = "";
          bytes.forEach((b) => (binString += String.fromCharCode(b)));
          const contentBase64 = btoa(binString);

          const putRes = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${githubConfig.token}`,
              "Content-Type": "application/json",
              Accept: "application/vnd.github.v3+json"
            },
            body: JSON.stringify({
              message: `Mise à jour des recettes - ${new Date().toLocaleString('fr-FR')}`,
              content: contentBase64,
              sha: sha || undefined,
              branch: githubConfig.branch || "main"
            })
          });

          if (!putRes.ok) {
            const errorData = await putRes.json();
            throw new Error(errorData.message || "Erreur lors de la sauvegarde sur GitHub.");
          }

          setSyncStatus("success");
          setStatusMessage("Recettes publiées sur GitHub avec succès !");
          setTimeout(() => setSyncStatus("idle"), 4000);
        } catch (error) {
          console.error("Erreur GitHub:", error);
          setSyncStatus("error");
          setStatusMessage(`Erreur : ${error.message}`);
        }
      };

      // Récupération depuis GitHub (Lecture)
      const fetchFromGitHub = async () => {
        if (!githubConfig.token || !githubConfig.owner || !githubConfig.repo) {
          setIsSettingsOpen(true);
          return;
        }

        if (!navigator.onLine) {
          setSyncStatus("error");
          setStatusMessage("Hors ligne : impossible de charger depuis GitHub. Vos recettes locales restent disponibles.");
          return;
        }

        setSyncStatus("syncing");
        setStatusMessage("Chargement depuis GitHub...");

        try {
          const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.path}`;
          const res = await fetch(url, {
            headers: {
              Authorization: `Bearer ${githubConfig.token}`,
              Accept: "application/vnd.github.v3+json"
            }
          });

          if (res.status === 404) {
            // Le fichier n'existe pas encore : on vérifie que le dépôt est accessible, puis on le crée
            const repoRes = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}`, {
              headers: {
                Authorization: `Bearer ${githubConfig.token}`,
                Accept: "application/vnd.github.v3+json"
              }
            });
            if (!repoRes.ok) {
              throw new Error("Dépôt introuvable ou token sans accès (vérifiez le propriétaire, le nom du dépôt et le droit 'Contents').");
            }
            setStatusMessage(`${githubConfig.path} n'existe pas encore : création en cours...`);
            await saveToGitHub(recipes);
            return;
          }
          if (!res.ok) throw new Error(`Lecture impossible sur GitHub (code ${res.status}).`);

          const data = await res.json();
          const binaryString = atob(data.content.replace(/\n/g, ''));
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const decodedJson = new TextDecoder().decode(bytes);
          const remoteRecipes = JSON.parse(decodedJson);

          if (Array.isArray(remoteRecipes)) {
            setRecipes(await Promise.all(remoteRecipes.map(externalizeRecipe)));
            setSyncStatus("success");
            setStatusMessage("Recettes chargées depuis GitHub !");
            setTimeout(() => setSyncStatus("idle"), 3000);
          } else {
            throw new Error("Le format du JSON n'est pas un tableau de recettes valide.");
          }
        } catch (error) {
          setSyncStatus("error");
          setStatusMessage(`Erreur : ${error.message}`);
        }
      };

      // Export local JSON
      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(recipes, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `recettes_sauvegarde_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Import local JSON
      const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              setRecipes(await Promise.all(imported.map(externalizeRecipe)));
              setStatusMessage("Recettes importées avec succès !");
            }
          } catch(err) {
            setStatusMessage("Erreur lors de la lecture du fichier JSON.");
          }
        };
        reader.readAsText(file);
      };

      const categories = ["Toutes", "Entrées", "Plats", "Desserts", "Boissons", "Pâtisserie", "Accompagnements"];

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          const matchesCategory = selectedCategory === "Toutes" || r.category === selectedCategory;
          const query = searchQuery.toLowerCase();
          const matchesSearch = !query || 
            r.title.toLowerCase().includes(query) ||
            r.adaptations?.toLowerCase().includes(query) ||
            (r.tags && r.tags.some(t => t.toLowerCase().includes(query))) ||
            (r.ingredients && r.ingredients.some(i => i.toLowerCase().includes(query)));
          return matchesCategory && matchesSearch;
        });
      }, [recipes, selectedCategory, searchQuery]);

      const handleSaveRecipe = async (recipeData) => {
        const base = recipeData.id ? recipeData : { ...recipeData, id: 'recette-' + Date.now() };
        const prepared = await externalizeRecipe({ ...base, updatedAt: new Date().toISOString() });
        const updatedList = recipeData.id
          ? recipes.map(r => r.id === prepared.id ? prepared : r)
          : [prepared, ...recipes];
        setRecipes(updatedList);
        if (selectedRecipe && selectedRecipe.id === prepared.id) setSelectedRecipe(prepared);
        setIsFormOpen(false);
        setRecipeToEdit(null);

        if (githubConfig.token && githubConfig.owner && githubConfig.repo) {
          saveToGitHub(updatedList);
        }
      };

      const handleDeleteRecipe = (id) => {
        if (confirm("Êtes-vous sûr de vouloir supprimer cette recette ?")) {
          const updatedList = recipes.filter(r => r.id !== id);
          setRecipes(updatedList);
          if (selectedRecipe && selectedRecipe.id === id) {
            setSelectedRecipe(null);
          }
          if (githubConfig.token && githubConfig.owner && githubConfig.repo) {
            saveToGitHub(updatedList);
          }
        }
      };

      return (
        <div className="flex-1 flex flex-col bg-slate-50 min-h-screen">
          {/* BARRE DE NAVIGATION */}
          <header className="bg-amber-700 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setSelectedCategory("Toutes"); setSearchQuery(""); }}>
                <div className="p-2 bg-amber-600 rounded-lg shadow-inner">
                  <Icon name="book" className="w-6 h-6 text-amber-100" />
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold font-serif leading-tight">Saveurs & Notes</h1>
                  <p className="text-xs text-amber-200 hidden sm:block">Mes recettes adaptées & personnelles</p>
                </div>
              </div>

              {/* Actions & Status */}
              <div className="flex items-center gap-2 sm:gap-3">
                {installPrompt && (
                  <button
                    onClick={handleInstall}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white text-amber-800 hover:bg-amber-50 transition shadow-sm"
                    title="Installer l'application"
                  >
                    <Icon name="download" className="w-4 h-4" />
                    <span className="hidden md:inline">Installer l'app</span>
                  </button>
                )}

                <button 
                  onClick={() => setIsSettingsOpen(true)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                    githubConfig.token ? 'bg-amber-800 text-amber-100 hover:bg-amber-900' : 'bg-amber-800/60 text-amber-200 border border-amber-500/40'
                  }`}
                  title="Configuration GitHub"
                >
                  <Icon name="github" className="w-4 h-4" />
                  <span className="hidden md:inline">
                    {githubConfig.token ? `${githubConfig.owner}/${githubConfig.repo}` : 'Configurer GitHub'}
                  </span>
                  <span className={`w-2 h-2 rounded-full ${githubConfig.token ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}`}></span>
                </button>

                {githubConfig.token && (
                  <button
                    onClick={() => saveToGitHub()}
                    disabled={syncStatus === "syncing"}
                    className="p-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition shadow-sm flex items-center justify-center"
                    title="Enregistrer sur GitHub"
                  >
                    <Icon name="refresh" className={`w-5 h-5 ${syncStatus === 'syncing' ? 'animate-spin' : ''}`} />
                  </button>
                )}

                <button
                  onClick={() => { setRecipeToEdit(null); setIsFormOpen(true); }}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold px-3 py-2 sm:px-4 sm:py-2 rounded-lg transition shadow-md flex items-center gap-2 text-sm"
                >
                  <Icon name="plus" className="w-5 h-5" />
                  <span className="hidden sm:inline">Ajouter une recette</span>
                </button>
              </div>
            </div>
          </header>

          {/* BANDEAU HORS LIGNE */}
          {!isOnline && (
            <div className="text-center text-xs sm:text-sm py-2 px-4 font-medium bg-slate-800 text-slate-100">
              Mode hors ligne : vos recettes sont consultables et modifiables, la synchronisation GitHub reprendra une fois reconnecté.
            </div>
          )}

          {/* BANDEAU MISE À JOUR DISPONIBLE */}
          {swRegistration && (
            <div className="text-center text-xs sm:text-sm py-2 px-4 font-medium bg-emerald-600 text-white flex items-center justify-center gap-3">
              <span>Une nouvelle version de l'application est disponible.</span>
              <button onClick={applyUpdate} className="underline font-semibold hover:text-emerald-100">Mettre à jour</button>
            </div>
          )}

          {/* MESSAGE BANNER SYNC STATUS */}
          {statusMessage && (
            <div className={`text-center text-xs sm:text-sm py-2 px-4 font-medium transition-all ${
              syncStatus === 'error' ? 'bg-red-500 text-white' :
              syncStatus === 'success' ? 'bg-emerald-600 text-white' : 'bg-amber-100 text-amber-900'
            }`}>
              {statusMessage}
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
            {/* BARRE DE RECHERCHE ET CATÉGORIES */}
            <div className="space-y-4 mb-8">
              <div className="flex flex-col sm:flex-row gap-3">
                <div className="relative flex-1">
                  <Icon name="search" className="w-5 h-5 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}

                  {searchQuery && (
                    <button onClick={() => setSearchQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                      <Icon name="close" className="w-4 h-4" />

                <div className="flex gap-2">

                    <Icon name="download" className="w-4 h-4 text-slate-500" />

                  </button>
                  <label className="px-3 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-medium shadow-sm flex items-center gap-1.5 cursor-pointer">

                    className={`px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${

                  >
                    {cat}
                  </button>

              </div>
            </div>

            {/* GRILLE DES RECETTES */}
            {filteredRecipes.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <Icon name="book" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                <h3 className="text-lg font-serif font-bold text-slate-700">Aucune recette trouvée</h3>
                <p className="text-slate-500 text-sm mt-1 max-w-md mx-auto">
                  {searchQuery || selectedCategory !== "Toutes" 
                    ? "Essayez de modifier votre recherche ou vos filtres de catégories."
                    : "Commencez par ajouter votre toute première recette personnalisée !"}
                </p>
                <button
                  onClick={() => { setRecipeToEdit(null); setIsFormOpen(true); }}
                  className="mt-4 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-lg text-sm shadow inline-flex items-center gap-2"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  Créer une recette
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredRecipes.map((recipe) => (
                  <div
                    key={recipe.id}
                    onClick={() => setSelectedRecipe(recipe)}
                    className="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col cursor-pointer group hover:-translate-y-0.5"
                  >
                    <div className="relative h-48 bg-slate-100 overflow-hidden">
                      <PhotoImg
                        src={recipe.resultPhoto || recipe.originalPhoto}
                        fallback="https://placehold.co/600x400/f5f5f4/a8a29e?text=Pas+de+photo"
                        alt={recipe.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                      />
                      <div className="absolute top-3 left-3 flex gap-2">
                        <span className="bg-amber-900/80 backdrop-blur-md text-amber-100 text-[11px] font-medium px-2.5 py-1 rounded-full shadow">
                          {recipe.category}
                        </span>
                        {recipe.adaptations && (
                          <span className="bg-emerald-800/80 backdrop-blur-md text-emerald-100 text-[11px] font-medium px-2.5 py-1 rounded-full shadow flex items-center gap-1">
                            <Icon name="sparkles" className="w-3 h-3 text-emerald-300" />
                            Adaptée
                          </span>
                        )}
                      </div>
                      
                      {recipe.rating > 0 && (
                        <div className="absolute bottom-3 right-3 bg-white/90 backdrop-blur-md px-2 py-0.5 rounded-md shadow-sm flex items-center gap-1 text-amber-500 text-xs font-bold">
                          <Icon name="star" className="w-3.5 h-3.5 fill-current" />
                          <span>{recipe.rating}</span>
                        </div>
                      )}
                    </div>

                    <div className="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 className="text-lg font-serif font-bold text-slate-800 group-hover:text-amber-700 transition-colors line-clamp-1">
                          {recipe.title}
                        </h3>

                        {recipe.adaptations && (
                          <p className="text-xs text-slate-500 mt-2 line-clamp-2 italic bg-amber-50/60 p-2 rounded-lg border border-amber-100/60">
                            "{recipe.adaptations}"
                          </p>
                        )}
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                        <div className="flex items-center gap-3">
                          {recipe.prepTime && (
                            <span className="flex items-center gap-1">
                              <Icon name="clock" className="w-3.5 h-3.5 text-slate-400" />
                              {recipe.prepTime}
                            </span>
                          )}
                          {recipe.servings && (
                            <span className="flex items-center gap-1">
                              <Icon name="users" className="w-3.5 h-3.5 text-slate-400" />
                              {recipe.servings} pers.
                            </span>
                          )}
                        </div>
                        <span className="text-amber-600 font-medium group-hover:translate-x-0.5 transition-transform">
                          Voir la fiche &rarr;
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* MODALE DETAILS DE LA RECETTE */}
          {selectedRecipe && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-y-auto shadow-2xl relative my-auto border border-slate-100">
                <div className="relative h-64 sm:h-80 bg-slate-900">
                  <PhotoImg
                    src={selectedRecipe.resultPhoto || selectedRecipe.originalPhoto}
                    fallback="https://placehold.co/800x500/f5f5f4/a8a29e?text=Photo"
                    alt={selectedRecipe.title}
                    className="w-full h-full object-cover opacity-90"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent"></div>
                  
                  <div className="absolute top-4 right-4 flex items-center gap-2">
                    <button
                      onClick={() => { setRecipeToEdit(selectedRecipe); setIsFormOpen(true); }}
                      className="p-2 bg-white/90 hover:bg-white text-slate-700 rounded-full shadow-lg backdrop-blur-md transition"
                      title="Éditer la recette"
                    >
                      <Icon name="edit" className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => handleDeleteRecipe(selectedRecipe.id)}
                      className="p-2 bg-red-600/90 hover:bg-red-600 text-white rounded-full shadow-lg backdrop-blur-md transition"
                      title="Supprimer la recette"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => setSelectedRecipe(null)}
                      className="p-2 bg-slate-900/70 hover:bg-slate-900 text-white rounded-full backdrop-blur-md transition"
                    >
                      <Icon name="close" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="absolute bottom-6 left-6 right-6 text-white">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="bg-amber-600 text-amber-50 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                        {selectedRecipe.category}
                      </span>
                      {selectedRecipe.rating > 0 && (
                        <div className="flex text-amber-400 text-xs">
                          {[...Array(5)].map((_, i) => (
                            <Icon key={i} name="star" className={`w-4 h-4 ${i < selectedRecipe.rating ? 'fill-current' : 'text-slate-600'}`} />
                          ))}
                        </div>
                      )}
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-serif font-bold text-white drop-shadow-sm">
                      {selectedRecipe.title}
                    </h2>
                  </div>
                </div>

                <div className="p-6 space-y-6">
                  <div className="grid grid-cols-3 gap-4 bg-amber-50/70 rounded-xl p-4 border border-amber-100 text-center">
                    <div>
                      <span className="text-xs text-slate-500 uppercase tracking-wider block">Préparation</span>
                      <span className="text-sm font-semibold text-slate-800">{selectedRecipe.prepTime || '-'}</span>
                    </div>
                    <div className="border-x border-amber-200/60">
                      <span className="text-xs text-slate-500 uppercase tracking-wider block">Cuisson</span>
                      <span className="text-sm font-semibold text-slate-800">{selectedRecipe.cookTime || '-'}</span>
                    </div>
                    <div>
                      <span className="text-xs text-slate-500 uppercase tracking-wider block">Portions</span>
                      <span className="text-sm font-semibold text-slate-800">{selectedRecipe.servings ? `${selectedRecipe.servings} pers.` : '-'}</span>
                    </div>
                  </div>

                  <div className="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl p-5 border border-amber-200 shadow-sm space-y-3">
                    <div className="flex items-center gap-2 text-amber-900 font-serif font-bold text-lg">
                      <Icon name="sparkles" className="w-5 h-5 text-amber-600" />
                      <h3>Mes adaptations & remarques personnelles</h3>
                    </div>
                    <p className="text-sm text-slate-700 whitespace-pre-line leading-relaxed font-sans">
                      {selectedRecipe.adaptations || "Aucune modification enregistrée pour cette recette."}
                    </p>

                    {(selectedRecipe.originalSource || selectedRecipe.originalPhoto) && (
                      <div className="mt-4 pt-3 border-t border-amber-200/60 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-slate-600">
                        {selectedRecipe.originalSource && (
                          <div>
                            <span className="font-semibold">Source d'origine :</span> {selectedRecipe.originalSource}
                          </div>

                        {selectedRecipe.originalPhoto && (
                          <button
                            type="button"
                            onClick={() => setLightboxSrc(selectedRecipe.originalPhoto)}
                            className="inline-flex items-center gap-1.5 text-amber-700 hover:text-amber-900 font-medium underline"
                          >
                            <Icon name="camera" className="w-4 h-4" />
                            Voir la photo de la recette originale
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                        {selectedRecipe.ingredients && selectedRecipe.ingredients.map((ing, idx) => (

                                <div onClick={() => setLightboxSrc(selectedRecipe.stepPhotos[idx])} className="cursor-zoom-in inline-block">
                                  <PhotoImg

            />
          )}

          {/* MODALE RÉGLAGES GITHUB TOKEN */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 border border-slate-100">
                <div className="flex items-center justify-between border-b pb-3">
                  <div className="flex items-center gap-2 text-slate-800 font-serif font-bold text-lg">
                    <Icon name="github" className="w-5 h-5 text-amber-700" />
                    <h2>Paramètres GitHub</h2>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-slate-500 leading-relaxed">
                  Entrez votre Personal Access Token (PAT) GitHub pour pouvoir lire et écrire votre fichier de recettes directement dans votre dépôt.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  localStorage.setItem("saveurs_github_config", JSON.stringify(githubConfig));
                  setIsSettingsOpen(false);
                  fetchFromGitHub();
                }} className="space-y-4 text-xs sm:text-sm">
                  <div>
                    <label className="block font-medium text-slate-700 mb-1">GitHub Token (PAT)</label>
                    <input
                      type="password"
                      required
                      placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                      value={githubConfig.token}
                      onChange={(e) => setGithubConfig({ ...githubConfig, token: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 font-mono text-xs"
                    />
                    <span className="text-[10px] text-slate-400 block mt-1">Nécessite la portée 'repo' ou 'contents:write'.</span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-medium text-slate-700 mb-1">Utilisateur / Owner</label>
                      <input
                        type="text"
                        required
                        placeholder="mon-pseudo"
                        value={githubConfig.owner}
                        onChange={(e) => setGithubConfig({ ...githubConfig, owner: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-slate-700 mb-1">Dépôt (Repo)</label>
                      <input
                        type="text"
                        required
                        placeholder="mes-recettes"
                        value={githubConfig.repo}
                        onChange={(e) => setGithubConfig({ ...githubConfig, repo: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-medium text-slate-700 mb-1">Chemin du fichier JSON</label>
                      <input
                        type="text"
                        required
                        placeholder="recettes.json"
                        value={githubConfig.path}
                        onChange={(e) => setGithubConfig({ ...githubConfig, path: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 font-mono text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-slate-700 mb-1">Branche</label>
                      <input
                        type="text"
                        required
                        placeholder="main"
                        value={githubConfig.branch}
                        onChange={(e) => setGithubConfig({ ...githubConfig, branch: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button
                      type="submit"
                      className="flex-1 bg-amber-700 hover:bg-amber-800 text-white py-2 rounded-lg font-medium transition shadow-sm text-xs sm:text-sm"
                    >
                      Enregistrer & Tester
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RecipeFormModal({ recipeToEdit, onClose, onSave, categories }) {
      const [formData, setFormData] = useState(recipeToEdit ? {
        ...recipeToEdit,
        stepPhotos: (recipeToEdit.steps || []).map((_, i) => (recipeToEdit.stepPhotos || [])[i] || "")
      } : {
        title: "",
        category: "Plats",
        prepTime: "",
        cookTime: "",
        servings: 4,
        rating: 5,
        originalSource: "",
        originalPhoto: "",
        resultPhoto: "",
        adaptations: "",
        ingredients: [""],
        steps: [""],
        stepPhotos: [""],
        tags: []
      });

      const [tagInput, setTagInput] = useState("");

      const handleImageUpload = async (e, field) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 900, 0.7);
          setFormData(prev => ({ ...prev, [field]: compressed }));
        }
      };

      const updateIngredient = (index, val) => {
        const list = [...formData.ingredients];
        list[index] = val;
        setFormData({ ...formData, ingredients: list });
      };

      const addIngredient = () => {
        setFormData({ ...formData, ingredients: [...formData.ingredients, ""] });
      };

      const removeIngredient = (index) => {
        setFormData({ ...formData, ingredients: formData.ingredients.filter((_, i) => i !== index) });
      };

      const updateStep = (index, val) => {
        const list = [...formData.steps];
        list[index] = val;
        setFormData({ ...formData, steps: list });
      };

      const setStepPhoto = (index, value) => {
        setFormData(prev => {
          const list = [...prev.stepPhotos];
          list[index] = value;
          return { ...prev, stepPhotos: list };
        });
      };

      const handleStepImage = async (e, index) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImage(file, 900, 0.7);
          setStepPhoto(index, compressed);
        }
      };

      const addStep = () => {
        setFormData({ ...formData, steps: [...formData.steps, ""], stepPhotos: [...formData.stepPhotos, ""] });
      };

      const removeStep = (index) => {
        setFormData({
          ...formData,
          steps: formData.steps.filter((_, i) => i !== index),
          stepPhotos: formData.stepPhotos.filter((_, i) => i !== index)
        });
      };

      const addTag = () => {
        if (tagInput.trim() && !formData.tags.includes(tagInput.trim())) {
          setFormData({ ...formData, tags: [...formData.tags, tagInput.trim()] });
          setTagInput("");
        }
      };

      const removeTag = (tagToRemove) => {
        setFormData({ ...formData, tags: formData.tags.filter(t => t !== tagToRemove) });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-3xl w-full my-auto shadow-2xl border border-slate-100 overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <h2 className="text-xl font-serif font-bold text-slate-800">
                {recipeToEdit ? "Modifier la recette" : "Nouvelle recette adaptée"}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={(e) => {
              e.preventDefault();
              onSave({
                ...formData,
                ingredients: formData.ingredients.filter(i => i.trim() !== ""),
                steps: formData.steps.filter(s => s.trim() !== ""),
                stepPhotos: formData.steps
                  .map((s, i) => s.trim() !== "" ? (formData.stepPhotos[i] || "") : null)
                  .filter(photo => photo !== null)
              });
            }} className="p-6 space-y-6 max-h-[80vh] overflow-y-auto text-sm">
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <label className="block font-medium text-slate-700 mb-1">Titre de la recette *</label>
                  <input
                    type="text"
                    required
                    value={formData.title}
                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                    placeholder="Ex: Poulet Rôti aux Herbes & Ail Doux"
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500"
                  />
                </div>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Catégorie</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                  >
                    {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Note de la recette</label>
                  <select
                    value={formData.rating}
                    onChange={(e) => setFormData({ ...formData, rating: Number(e.target.value) })}
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                  >
                    {[5, 4, 3, 2, 1].map(num => (
                      <option key={num} value={num}>{num} étoiles</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Temps de prép.</label>
                  <input
                    type="text"
                    value={formData.prepTime}
                    onChange={(e) => setFormData({ ...formData, prepTime: e.target.value })}
                    placeholder="Ex: 20 min"
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500"
                  />
                </div>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Temps de cuisson</label>
                  <input
                    type="text"
                    value={formData.cookTime}
                    onChange={(e) => setFormData({ ...formData, cookTime: e.target.value })}
                    placeholder="Ex: 45 min"
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500"
                  />
                </div>
              </div>

              <div className="bg-amber-50/70 p-4 rounded-xl border border-amber-200/80 space-y-4">
                <h3 className="font-serif font-bold text-amber-900 flex items-center gap-2">
                  <Icon name="sparkles" className="w-5 h-5 text-amber-600" />
                  Vos modifications & résultats
                </h3>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Vos remarques & ajustements apportés *</label>
                  <textarea
                    rows="3"
                    required
                    value={formData.adaptations}
                    onChange={(e) => setFormData({ ...formData, adaptations: e.target.value })}
                    placeholder="Ex: J'ai réduit le beurre de moitié, remplacé le sucre blanc par du miel de fleur et cuit à 180°C."
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                  ></textarea>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block font-medium text-slate-700 mb-1">Photo de votre résultat</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleImageUpload(e, 'resultPhoto')}
                      className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer"
                    />
                    {formData.resultPhoto && (
                      <PhotoImg src={formData.resultPhoto} alt="Aperçu résultat" className="mt-2 h-24 w-full object-cover rounded-lg border" />
                    )}
                  </div>

                  <div>
                    <label className="block font-medium text-slate-700 mb-1">Photo / Livre de la recette originale</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleImageUpload(e, 'originalPhoto')}
                      className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-800 hover:file:bg-slate-200 cursor-pointer"
                    />
                    {formData.originalPhoto && (
                      <PhotoImg src={formData.originalPhoto} alt="Aperçu original" className="mt-2 h-24 w-full object-cover rounded-lg border" />
                    )}
                  </div>
                </div>

                <div>
                  <label className="block font-medium text-slate-700 mb-1">Source d'origine (Livre, site, auteur)</label>
                  <input
                    type="text"
                    value={formData.originalSource}
                    onChange={(e) => setFormData({ ...formData, originalSource: e.target.value })}
                    placeholder="Ex: Livre Ottolenghi 'SIMPLE' p. 112"
                    className="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                  />
                </div>
              </div>

              <div className="space-y-2">
                <label className="block font-medium text-slate-700">Ingrédients</label>
                {formData.ingredients.map((ing, idx) => (
                  <div key={idx} className="flex gap-2">
                    <input
                      type="text"
                      value={ing}
                      onChange={(e) => updateIngredient(idx, e.target.value)}
                      placeholder={`Ingrédient ${idx + 1}`}
                      className="flex-1 px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-amber-500"
                    />
                    {formData.ingredients.length > 1 && (
                      <button type="button" onClick={() => removeIngredient(idx)} className="text-red-500 hover:text-red-700 px-2">
                        <Icon name="close" className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                ))}
                <button
                  type="button"
                  onClick={addIngredient}
                  className="text-xs text-amber-700 font-semibold hover:underline flex items-center gap-1 mt-1"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> Ajouter un ingrédient
                </button>
              </div>

              <div className="space-y-2">
                <label className="block font-medium text-slate-700">Étapes de la recette</label>
                {formData.steps.map((step, idx) => (
                  <div key={idx} className="flex gap-2 items-start">
                    <span className="mt-2 text-xs font-bold text-slate-400">{idx + 1}.</span>
                    <div className="flex-1 space-y-2">
                      <textarea
                        rows="2"
                        value={step}
                        onChange={(e) => updateStep(idx, e.target.value)}
                        placeholder={`Étape ${idx + 1}`}
                        className="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-amber-500"
                      ></textarea>
                      <div className="flex items-center gap-3 flex-wrap">
                        <input
                          key={formData.stepPhotos[idx] ? "avec-photo" : "sans-photo"}
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleStepImage(e, idx)}
                          className="text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer"
                        />
                        {formData.stepPhotos[idx] && (
                          <>
                            <PhotoImg src={formData.stepPhotos[idx]} alt={`Étape ${idx + 1}`} className="h-14 w-20 object-cover rounded-lg border" />
                            <button type="button" onClick={() => setStepPhoto(idx, "")} className="text-xs text-red-500 hover:text-red-700">
                              Retirer la photo
                            </button>
                          </>
                        )}
                      </div>
                    </div>
                    {formData.steps.length > 1 && (
                      <button type="button" onClick={() => removeStep(idx)} className="text-red-500 hover:text-red-700 px-2 mt-2">
                        <Icon name="close" className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                ))}
                <button
                  type="button"
                  onClick={addStep}
                  className="text-xs text-amber-700 font-semibold hover:underline flex items-center gap-1 mt-1"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> Ajouter une étape
                </button>
              </div>

              <div>
                <label className="block font-medium text-slate-700 mb-1">Tags & Mots-clés</label>
                <div className="flex gap-2 mb-2">
                  <input
                    type="text"
                    value={tagInput}
                    onChange={(e) => setTagInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } }}
                    placeholder="Ex: Tarte, Sans Gluten, Rapide"
                    className="flex-1 px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-amber-500"
                  />
                  <button type="button" onClick={addTag} className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-medium">
                    Ajouter
                  </button>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {formData.tags.map(tag => (
                    <span key={tag} className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md text-xs flex items-center gap-1">
                      #{tag}
                      <button type="button" onClick={() => removeTag(tag)} className="hover:text-red-600">×</button>
                    </span>
                  ))}
                </div>
              </div>

              <div className="pt-4 border-t flex justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border rounded-xl text-slate-600 hover:bg-slate-50 font-medium"
                >
                  Annuler
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-amber-700 hover:bg-amber-800 text-white font-medium rounded-xl shadow transition"
                >
                  Enregistrer la recette
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>

  <!-- PWA : enregistrement du service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js");

          const notifyUpdate = () => {
            window.__swUpdateReg = reg;
            window.dispatchEvent(new CustomEvent("sw-update-ready", { detail: reg }));
          };

          // Nouvelle version déjà en attente au chargement
          if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();

          reg.addEventListener("updatefound", () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              if (worker.state === "installed" && navigator.serviceWorker.controller) notifyUpdate();
            });
          });

          // Recharger une fois la nouvelle version activée
          let reloaded = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        } catch (err) {
          console.warn("Service worker non enregistré :", err);
        }
      });
    }
  </script>
</body>
</html>
