name: PWA validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pwa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test PWA manifest and service worker
        run: node --test tests/pwa.test.mjs
